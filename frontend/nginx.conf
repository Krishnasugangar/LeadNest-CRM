server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS. A variable in proxy_pass makes nginx re-resolve the backend
    # after that container is recreated, instead of keeping the first IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend_origin http://backend:8081;
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/ {
        set $backend_origin http://backend:8081;
        proxy_pass $backend_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        set $backend_origin http://backend:8081;
        proxy_pass $backend_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /swagger-ui.html {
        set $backend_origin http://backend:8081;
        proxy_pass $backend_origin$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
